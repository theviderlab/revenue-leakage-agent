[project]
name = "revenue-leakage-agent-backend"
description = "Backend API for the Revenue Leakage Agent: billing detector and human-in-the-loop LangGraph agent."
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "pydantic-settings>=2.16.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# One tool per line reads better than wrapping the descriptions.
"app/agent/tools.py" = ["E501"]
"app/agent/prompt.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not llm'"
markers = ["llm: calls the real LLM (make eval-llm); not run by default"]
